<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Food Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-danger">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Online Food Ordering</span>
      <span class="text-white">Cart Items: <span id="cartCount" class="badge bg-light text-dark">0</span></span>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row">

      <div class="col-lg-8 mb-4">
        <h3 class="mb-3">Menu</h3>
        <div class="mb-3">
          <select id="categoryFilter" class="form-select">
            <option value="All">All Categories</option>
          </select>
        </div>
        <div id="foodList" class="row g-3"></div>
      </div>

      <div class="col-lg-4">
        <div class="card mb-4">
          <div class="card-header bg-dark text-white">Your Cart</div>
          <ul id="cartList" class="list-group list-group-flush"></ul>
          <div class="card-footer">
            <strong>Total Bill: Rs. <span id="totalBill">0</span></strong>
          </div>
        </div>

        <div class="card">
          <div class="card-header bg-dark text-white">Customer Details</div>
          <div class="card-body">
            <form id="orderForm" novalidate>
              <div class="mb-3">
                <label for="customerName" class="form-label">Name</label>
                <input type="text" id="customerName" class="form-control">
                <div id="nameError" class="text-danger small"></div>
              </div>
              <div class="mb-3">
                <label for="customerPhone" class="form-label">Phone</label>
                <input type="text" id="customerPhone" class="form-control" placeholder="03001234567">
                <div id="phoneError" class="text-danger small"></div>
              </div>
              <div class="mb-3">
                <label for="customerEmail" class="form-label">Email</label>
                <input type="text" id="customerEmail" class="form-control">
                <div id="emailError" class="text-danger small"></div>
              </div>
              <div class="mb-3">
                <label for="customerAddress" class="form-label">Address</label>
                <textarea id="customerAddress" class="form-control" rows="3"></textarea>
                <div id="addressError" class="text-danger small"></div>
              </div>
              <button type="submit" class="btn btn-danger w-100">Place Order</button>
            </form>
            <div id="orderMessage" class="mt-3"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="js/foodDisplay.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/formValidation.js"></script>
  <script src="js/orderSubmit.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
